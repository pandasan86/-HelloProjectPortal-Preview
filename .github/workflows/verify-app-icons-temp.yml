name: Temporary verify app icons preview

on:
  push:
    branches: [main]
    paths: ['.tmp/verify-app-icons-ready']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wait for and validate deployed preview
        shell: python
        run: |
          import json, re, struct, time
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          from pathlib import Path

          base = 'https://pandasan86.github.io/-HelloProjectPortal-Preview/'
          source_ref = 'feature/20260808_app-icons-pwa'
          api = 'https://api.github.com/repos/pandasan86/HelloProjectPortal/git/ref/heads/' + source_ref.replace('/', '%2F')

          def fetch(url, binary=False):
              req = Request(url, headers={'User-Agent':'HelloProjectPortal-preview-validator'})
              with urlopen(req, timeout=30) as r:
                  body = r.read()
                  if r.status != 200:
                      raise RuntimeError((url, r.status))
                  return body if binary else body.decode('utf-8')

          source_sha = json.loads(fetch(api))['object']['sha']
          last = None
          for _ in range(24):
              try:
                  meta = json.loads(fetch(urljoin(base, 'preview-source.json')))
                  last = meta
                  if meta.get('ref') == source_ref and meta.get('sha') == source_sha:
                      break
              except Exception as e:
                  last = repr(e)
              time.sleep(15)
          else:
              raise SystemExit(f'preview did not reach source ref/sha: expected={source_ref}@{source_sha}, last={last}')

          manifest_specs = {
              'manifest.webmanifest': ('portal','ハロプロポータル','ハロプロ'),
              'games/manifest.webmanifest': ('games','ハロプロポータル ゲームコーナー','ゲーム'),
              'games/profile-quiz/manifest.webmanifest': ('profile-quiz','プロフィールクイズ','プロフィール'),
              'games/blog-kentei/manifest.webmanifest': ('blog-kentei','昨日のブログ検定','ブログ検定'),
          }
          for path,(kind,name,short_name) in manifest_specs.items():
              url = urljoin(base,path)
              data = json.loads(fetch(url))
              assert data['id'] == data['start_url'] == data['scope'] == './', (path,data)
              assert data['name'] == name and data['short_name'] == short_name, (path,data)
              assert data['display'] == 'standalone'
              assert [x['sizes'] for x in data['icons']] == ['192x192','512x512','512x512']
              assert [x['purpose'] for x in data['icons']] == ['any','any','maskable']
              for icon in data['icons']:
                  raw = fetch(urljoin(url, icon['src']), binary=True)
                  assert raw[:8] == b'\x89PNG\r\n\x1a\n'
                  w,h = struct.unpack('>II', raw[16:24])
                  expected_size = int(icon['sizes'].split('x')[0])
                  assert (w,h) == (expected_size,expected_size), (path,icon['src'],w,h)

          pages = {
              'index.html': ('portal','manifest.webmanifest'),
              'games/index.html': ('games','manifest.webmanifest'),
              'games/profile-quiz/index.html': ('profile-quiz','manifest.webmanifest'),
              'games/blog-kentei/index.html': ('blog-kentei','manifest.webmanifest'),
          }
          for group in ('morning-musume','angerme','juice-juice','tsubaki-factory','beyooooonds','ocha-norma','rosy-chronicle'):
              pages[f'games/blog-kentei/{group}/index.html'] = ('blog-kentei','../manifest.webmanifest')

          for path,(kind,manifest_href) in pages.items():
              url = urljoin(base,path)
              html = fetch(url)
              manifest = re.findall(r'<link\s+[^>]*rel="manifest"[^>]*href="([^"]+)"[^>]*>', html, re.I)
              apple = re.findall(r'<link\s+[^>]*rel="apple-touch-icon"[^>]*href="([^"]+)"[^>]*>', html, re.I)
              assert manifest == [manifest_href], (path,manifest)
              assert len(apple) == 1, (path,apple)
              assert f'hello-project-portal_app-icon_{kind}_180_v1.png' in apple[0], (path,apple)
              raw = fetch(urljoin(url, apple[0]), binary=True)
              w,h = struct.unpack('>II', raw[16:24])
              assert (w,h) == (180,180), (path,w,h)

          print('PREVIEW_APP_ICON_VALIDATION_OK')
          print(json.dumps({'ref':source_ref,'sha':source_sha,'manifests':4,'pages':11,'icons':16}, ensure_ascii=False))

          Path('.tmp/verify-app-icons-ready').unlink(missing_ok=True)
          Path('.github/workflows/verify-app-icons-temp.yml').unlink(missing_ok=True)

      - name: Remove temporary validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PWAアイコンPreview検証を完了'
          git push origin HEAD:main
