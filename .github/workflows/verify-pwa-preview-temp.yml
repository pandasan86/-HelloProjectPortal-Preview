name: Temporary PWA preview verification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-pwa-preview-temp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify deployed PWA preview
        shell: python
        run: |
          import hashlib, json, re, struct, time, urllib.request

          base = 'https://pandasan86.github.io/-HelloProjectPortal-Preview/'
          expected_sha = '092ef9d0b02ae3199a04a9f6aa265a617185d1cf'
          hashes = {
              'hello-project-portal_app-icon_portal_180_v1.png': '6a52a5d57c1e04e5ba467bf37a690569f41c17351858ba774325ae379dea521c',
              'hello-project-portal_app-icon_portal_192_v1.png': 'fbf658dc59f6326beee259be20d9ffdbbac9b67307492ee6dc5b40b97667d013',
              'hello-project-portal_app-icon_portal_512_v1.png': '0d5f4961896b25f485bee38f0506d8368e75156f4343becd37c121767a50d61f',
              'hello-project-portal_app-icon_portal_maskable-512_v1.png': '687ea2ad69ff14a7eecb223a11c840f6c4f12585d8d6a6e6a1952637463c70a0',
              'hello-project-portal_app-icon_games_180_v1.png': 'c3af34681b62efef63dbd10d50f1a2c212cd3266682497028d57be078d3f8b4c',
              'hello-project-portal_app-icon_games_192_v1.png': 'bbf818f395c98cf36fefee5389a60ba4037e7759358fc6356b641d8cac5aa060',
              'hello-project-portal_app-icon_games_512_v1.png': 'da5cb59518a4e4716a97ed08ddf06de56b7870dad06edada8f2db31ce3554e51',
              'hello-project-portal_app-icon_games_maskable-512_v1.png': '3fab86a42ae18ae64e5f09ddcb35d37c26ae59f9cc6ccb4aafce118682989849',
              'hello-project-portal_app-icon_profile-quiz_180_v1.png': 'ea67344de2f79a8bf523c1bd00136ef83ecdd393e42a6b5090bd75d4c0e87cc3',
              'hello-project-portal_app-icon_profile-quiz_192_v1.png': 'b443d23f5e015ea4c7ff08fd2a4a90903c828e4579c76f2f40e5b5bc08bd5168',
              'hello-project-portal_app-icon_profile-quiz_512_v1.png': '1f9af00b898511dad6740c844d9ec1d326b2802334675157819295f74e487c01',
              'hello-project-portal_app-icon_profile-quiz_maskable-512_v1.png': '5bc870390307e60231f7b22d3a58b344196d8e352fe0ef610f2cc6bb43fc88fa',
              'hello-project-portal_app-icon_blog-kentei_180_v1.png': 'e680eb35d939b020a9f1622612aabcd82b15fab59df07525bac81654308aabf9',
              'hello-project-portal_app-icon_blog-kentei_192_v1.png': '8241c8e8cac79e9662a790e23f4530cf8a392e2d9c1641cc84a5dc0d33e6b39a',
              'hello-project-portal_app-icon_blog-kentei_512_v1.png': 'fb24272936982b7a24be946f27466b3333be971e30a043dfb599d0b198346b9b',
              'hello-project-portal_app-icon_blog-kentei_maskable-512_v1.png': 'f360b5f78a7c2c4d58af1f3c9cccee3012b2eda3df9645f54ca6188533f7f90b',
          }

          def get(path):
              req = urllib.request.Request(base + path, headers={'Cache-Control':'no-cache','User-Agent':'preview-validator'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  assert r.status == 200, (path, r.status)
                  return r.read()

          last = None
          for _ in range(12):
              try:
                  meta = json.loads(get('preview-source.json').decode())
                  if meta.get('ref') == 'feature/20260808_app-icons-pwa' and meta.get('sha') == expected_sha:
                      break
                  last = meta
              except Exception as e:
                  last = repr(e)
              time.sleep(5)
          else:
              raise AssertionError(('preview-source mismatch', last))

          manifests = ['manifest.webmanifest','games/manifest.webmanifest','games/profile-quiz/manifest.webmanifest','games/blog-kentei/manifest.webmanifest']
          for path in manifests:
              data = json.loads(get(path).decode('utf-8'))
              assert data['id'] == './'
              assert data['start_url'] == './'
              assert data['scope'] == './'
              assert data['display'] == 'standalone'
              assert [x['sizes'] for x in data['icons']] == ['192x192','512x512','512x512']
              assert [x['purpose'] for x in data['icons']] == ['any','any','maskable']

          icon_base = 'character/10_master/icons/app-icons/'
          for name, expected_hash in hashes.items():
              body = get(icon_base + name)
              assert hashlib.sha256(body).hexdigest() == expected_hash, name
              assert body[:8] == b'\x89PNG\r\n\x1a\n' and body[12:16] == b'IHDR', name
              size = struct.unpack('>II', body[16:24])
              want = (180,180) if '_180_' in name else (192,192) if '_192_' in name else (512,512)
              assert size == want, (name, size, want)

          pages = {
              'index.html': ('manifest.webmanifest', 'portal'),
              'games/index.html': ('manifest.webmanifest', 'games'),
              'games/profile-quiz/index.html': ('manifest.webmanifest', 'profile-quiz'),
              'games/blog-kentei/index.html': ('manifest.webmanifest', 'blog-kentei'),
          }
          for group in ('morning-musume','angerme','juice-juice','tsubaki-factory','beyooooonds','ocha-norma','rosy-chronicle'):
              pages[f'games/blog-kentei/{group}/index.html'] = ('../manifest.webmanifest', 'blog-kentei')
          for path, (manifest_href, kind) in pages.items():
              text = get(path).decode('utf-8')
              assert f'rel="manifest" href="{manifest_href}"' in text, path
              expected_apple = 'character/10_master/icons/app-icons/' if path == 'index.html' else '../character/10_master/icons/app-icons/' if path == 'games/index.html' else '../../character/10_master/icons/app-icons/' if path in ('games/profile-quiz/index.html','games/blog-kentei/index.html') else '../../../character/10_master/icons/app-icons/'
              assert f'rel="apple-touch-icon" href="{expected_apple}hello-project-portal_app-icon_{kind}_180_v1.png"' in text, path

          print('PWA_PREVIEW_VALIDATION_OK')
          print('source_sha=' + expected_sha)
          print('icons=16 exact_hashes=16 manifests=4 html_pages=11')

      - name: Clean temporary verifier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-pwa-preview-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PWA Preview検証用一時workflowを削除'
          git push origin HEAD:main
