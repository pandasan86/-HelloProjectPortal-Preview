name: Deploy HelloProjectPortal preview

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-preview.yml'
      - 'refresh.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: pandasan86/HelloProjectPortal
  SOURCE_REF: feature/20260807_blog-kentei-scheduled-preview
  PREVIEW_METADATA_URL: https://pandasan86.github.io/-HelloProjectPortal-Preview/preview-source.json
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.prepare.outputs.should_deploy }}
    steps:
      - name: Check out preview source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare static site
        id: prepare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          should_deploy=true

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            deployed_sha="$({
              curl -fsSL --max-time 15 "${PREVIEW_METADATA_URL}" |
                python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))'
            } 2>/dev/null || true)"
            if [[ "${deployed_sha}" == "${source_sha}" ]]; then
              should_deploy=false
            fi
          fi

          echo "should_deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"

          rm -rf site
          mkdir site
          cp source/index.html site/
          cp -a source/assets site/
          cp -a source/character site/
          cp -a source/games site/
          if [[ -f source/404.html ]]; then
            cp source/404.html site/
          fi
          touch site/.nojekyll
          cat > site/preview-source.json <<EOF
          {
            "repository": "${SOURCE_REPOSITORY}",
            "ref": "${SOURCE_REF}",
            "sha": "${source_sha}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Configure GitHub Pages
        if: steps.prepare.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.prepare.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
