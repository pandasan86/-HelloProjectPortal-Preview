name: Deploy HelloProjectPortal preview

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: pandasan86/HelloProjectPortal
  SOURCE_REF: feature/20260805_blog-kentei-top-ui
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: site
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C site rev-parse HEAD)"
          rm -rf site/.git site/.github
          rm -f site/.gitignore
          touch site/.nojekyll
          cat > site/preview-source.json <<EOF
          {
            "repository": "${SOURCE_REPOSITORY}",
            "ref": "${SOURCE_REF}",
            "sha": "${source_sha}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
