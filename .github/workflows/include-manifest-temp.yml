name: Temporary include root manifest

on:
  push:
    branches: [main]
    paths: ['.tmp/include-manifest-ready']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Include root manifest in preview artifact
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('.github/workflows/deploy-preview.yml')
          text = path.read_text(encoding='utf-8')
          changed = False

          if 'manifest.webmanifest' not in text:
              lines = text.splitlines(True)
              for i, line in enumerate(lines):
                  if 'for ' in line and ' in ' in line and 'index.html' in line and 'do' in line:
                      lines[i] = line.replace('index.html', 'index.html manifest.webmanifest', 1)
                      changed = True
                      break
              if not changed:
                  # Support common allow-list variables such as PUBLIC_ITEMS="index.html assets ..."
                  for i, line in enumerate(lines):
                      if 'index.html' in line and any(token in line for token in ('assets', 'character', 'games')) and 'cp ' not in line:
                          lines[i] = line.replace('index.html', 'index.html manifest.webmanifest', 1)
                          changed = True
                          break
              if not changed:
                  raise SystemExit('Could not safely locate preview public-item allow-list')
              text = ''.join(lines)
              path.write_text(text, encoding='utf-8')

          Path('.tmp/include-manifest-ready').unlink(missing_ok=True)
          Path('.github/workflows/include-manifest-temp.yml').unlink(missing_ok=True)
          Path('refresh.json').write_text('{"reason":"include-root-manifest"}\n', encoding='utf-8')

      - name: Commit preview workflow adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preview成果物へroot manifestを追加'
          git push origin HEAD:main
